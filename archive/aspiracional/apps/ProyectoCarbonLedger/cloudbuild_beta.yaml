steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoCarbonLedger'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-carbon-ledger:beta', 'apps/ProyectoCarbonLedger']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-carbon-ledger:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-carbon-ledger:beta'
