steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoCarbonLedger'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-carbon-ledger:latest', 'apps/ProyectoCarbonLedger']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-carbon-ledger:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-carbon-ledger:latest'
