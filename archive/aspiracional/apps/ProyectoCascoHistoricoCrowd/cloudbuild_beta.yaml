steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoCascoHistoricoCrowd'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-casco-historico-crowd:beta', 'apps/ProyectoCascoHistoricoCrowd']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-casco-historico-crowd:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-casco-historico-crowd:beta'
