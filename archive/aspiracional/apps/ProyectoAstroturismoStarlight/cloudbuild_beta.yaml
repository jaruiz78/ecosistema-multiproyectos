steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoAstroturismoStarlight'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-astroturismo-starlight:beta', 'apps/ProyectoAstroturismoStarlight']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-astroturismo-starlight:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-astroturismo-starlight:beta'
