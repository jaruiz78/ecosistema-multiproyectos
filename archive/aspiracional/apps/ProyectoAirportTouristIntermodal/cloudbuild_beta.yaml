steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoAirportTouristIntermodal'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-airport-tourist-intermodal:beta', 'apps/ProyectoAirportTouristIntermodal']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-airport-tourist-intermodal:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-airport-tourist-intermodal:beta'
