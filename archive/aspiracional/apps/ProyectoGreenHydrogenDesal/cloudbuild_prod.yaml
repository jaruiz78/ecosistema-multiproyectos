steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoGreenHydrogenDesal'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-green-hydrogen-desal:latest', 'apps/ProyectoGreenHydrogenDesal']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-green-hydrogen-desal:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-green-hydrogen-desal:latest'
