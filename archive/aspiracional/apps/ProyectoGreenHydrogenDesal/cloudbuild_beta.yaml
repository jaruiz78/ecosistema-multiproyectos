steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoGreenHydrogenDesal'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-green-hydrogen-desal:beta', 'apps/ProyectoGreenHydrogenDesal']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-green-hydrogen-desal:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-green-hydrogen-desal:beta'
