steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoEnoturismoRutasVino'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-enoturismo-rutas-vino:latest', 'apps/ProyectoEnoturismoRutasVino']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-enoturismo-rutas-vino:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-enoturismo-rutas-vino:latest'
