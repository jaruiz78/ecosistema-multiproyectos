steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoPharmaColdChain'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-pharma-cold-chain:latest', 'apps/ProyectoPharmaColdChain']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-pharma-cold-chain:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-pharma-cold-chain:latest'
