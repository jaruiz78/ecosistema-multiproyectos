steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoSoilBioCarbonTwin'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-soil-bio-carbon-twin:latest', 'apps/ProyectoSoilBioCarbonTwin']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-soil-bio-carbon-twin:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-soil-bio-carbon-twin:latest'
