steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoFleetColdChain'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-fleet-cold-chain:beta', 'apps/ProyectoFleetColdChain']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-fleet-cold-chain:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-fleet-cold-chain:beta'
