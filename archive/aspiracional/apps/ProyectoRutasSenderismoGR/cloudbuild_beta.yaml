steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoRutasSenderismoGR'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-rutas-senderismo-gr:beta', 'apps/ProyectoRutasSenderismoGR']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-rutas-senderismo-gr:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-rutas-senderismo-gr:beta'
