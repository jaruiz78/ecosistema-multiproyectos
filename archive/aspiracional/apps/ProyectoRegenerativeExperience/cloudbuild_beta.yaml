steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoRegenerativeExperience'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-regenerative-experience:beta', 'apps/ProyectoRegenerativeExperience']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-regenerative-experience:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-regenerative-experience:beta'
