steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoSmartDestinationDTI'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-smart-destination-dti:beta', 'apps/ProyectoSmartDestinationDTI']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-smart-destination-dti:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-smart-destination-dti:beta'
