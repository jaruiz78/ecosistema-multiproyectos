steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoTaxComplianceLedger'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-tax-compliance-ledger:latest', 'apps/ProyectoTaxComplianceLedger']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-tax-compliance-ledger:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-tax-compliance-ledger:latest'
