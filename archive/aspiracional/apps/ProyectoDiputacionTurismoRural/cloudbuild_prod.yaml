steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoDiputacionTurismoRural'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-diputacion-turismo-rural:latest', 'apps/ProyectoDiputacionTurismoRural']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-diputacion-turismo-rural:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-diputacion-turismo-rural:latest'
