steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoPortTwinAutonomous'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-port-twin-autonomous:latest', 'apps/ProyectoPortTwinAutonomous']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-port-twin-autonomous:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-port-twin-autonomous:latest'
