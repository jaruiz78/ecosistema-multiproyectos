steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoParquesNacionalesNatura2000'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-parques-nacionales-natura2000:latest', 'apps/ProyectoParquesNacionalesNatura2000']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-parques-nacionales-natura2000:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-parques-nacionales-natura2000:latest'
