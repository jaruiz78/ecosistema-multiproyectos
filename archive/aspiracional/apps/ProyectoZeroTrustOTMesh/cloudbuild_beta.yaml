steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'test']
    dir: 'apps/ProyectoZeroTrustOTMesh'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-zero-trust-ot-mesh:beta', 'apps/ProyectoZeroTrustOTMesh']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-zero-trust-ot-mesh:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-zero-trust-ot-mesh:beta'
