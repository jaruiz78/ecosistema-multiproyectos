steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoCaminoSantiagoXacobeo'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-camino-santiago-xacobeo:latest', 'apps/ProyectoCaminoSantiagoXacobeo']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-camino-santiago-xacobeo:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-camino-santiago-xacobeo:latest'
