steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoClinicalTrialsZK'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-clinical-trials-zk:latest', 'apps/ProyectoClinicalTrialsZK']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-clinical-trials-zk:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-clinical-trials-zk:latest'
