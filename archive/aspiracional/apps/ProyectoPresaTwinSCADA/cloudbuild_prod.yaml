steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoPresaTwinSCADA'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-presa-twin-scada:latest', 'apps/ProyectoPresaTwinSCADA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-presa-twin-scada:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-presa-twin-scada:latest'
