    args: ['clean', 'test']
    dir: 'apps/ProyectoHeritageDigitalTwin3D'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-heritage-digital-twin-3d:beta', 'apps/ProyectoHeritageDigitalTwin3D']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-heritage-digital-twin-3d:beta']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-heritage-digital-twin-3d:beta'
