steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'apps/ProyectoSeamlessIntermodalHub'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/proyecto-seamless-intermodal-hub:latest', 'apps/ProyectoSeamlessIntermodalHub']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/proyecto-seamless-intermodal-hub:latest']
images:
  - 'gcr.io/$PROJECT_ID/proyecto-seamless-intermodal-hub:latest'
