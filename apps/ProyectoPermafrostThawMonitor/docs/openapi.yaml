openapi: 3.1.0
info:
  title: ProyectoPermafrostThawMonitor API
  description: Monitoreo Geofisico de Deshielo de Permafrost y Subsidencia del Terreno
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectopermafrostthawmonitor
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectopermafrostthawmonitor/{id}:
    get:
      summary: Obtener PermafrostThawDepthSubsidenceNode por Identificador
      operationId: getPermafrostThawDepthSubsidenceNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PermafrostThawDepthSubsidenceNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermafrostThawDepthSubsidenceNode'
        '404':
          description: No encontrado
components:
  schemas:
    PermafrostThawDepthSubsidenceNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
