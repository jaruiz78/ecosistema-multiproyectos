openapi: 3.1.0
info:
  title: ProyectoAutonomousMaritimeFreighter API
  description: Buques Mercantes Oceanicos Autonomos con Evasion de Colisiones COLREGs
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoautonomousmaritimefreighter
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoautonomousmaritimefreighter/{id}:
    get:
      summary: Obtener MassVesselCollisionAvoidanceNode por Identificador
      operationId: getMassVesselCollisionAvoidanceNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MassVesselCollisionAvoidanceNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassVesselCollisionAvoidanceNode'
        '404':
          description: No encontrado
components:
  schemas:
    MassVesselCollisionAvoidanceNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
