openapi: 3.1.0
info:
  title: ProyectoQuantumKeyEscrowSharding API
  description: Custodia Institucional de Claves Criptograficas Fragmentadas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoquantumkeyescrowsharding
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoquantumkeyescrowsharding/{id}:
    get:
      summary: Obtener ShamirPqcKeyShardBundleToken por Identificador
      operationId: getShamirPqcKeyShardBundleTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ShamirPqcKeyShardBundleToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShamirPqcKeyShardBundleToken'
        '404':
          description: No encontrado
components:
  schemas:
    ShamirPqcKeyShardBundleToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
