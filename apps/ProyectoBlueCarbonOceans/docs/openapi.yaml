openapi: 3.1.0
info:
  title: ProyectoBlueCarbonOceans API
  description: Gemelo Digital Marino de Carbono Azul, Biomasa de Posidonia y Calidad Oceanografica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectobluecarbonoceans
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectobluecarbonoceans/{id}:
    get:
      summary: Obtener MarinePosidoniaCarbonSink por Identificador
      operationId: getMarinePosidoniaCarbonSinkById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MarinePosidoniaCarbonSink recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarinePosidoniaCarbonSink'
        '404':
          description: No encontrado
components:
  schemas:
    MarinePosidoniaCarbonSink:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
