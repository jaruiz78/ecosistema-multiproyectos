openapi: 3.1.0
info:
  title: ProyectoSpaceAgriRegenerativeHabitat API
  description: Agricultura Espacial y Soporte Vital Biorregenerativo Cerrado (ECLSS) para Habitats
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectospaceagriregenerativehabitat
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectospaceagriregenerativehabitat/{id}:
    get:
      summary: Obtener SpaceHabitatEclssLoopNode por Identificador
      operationId: getSpaceHabitatEclssLoopNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SpaceHabitatEclssLoopNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceHabitatEclssLoopNode'
        '404':
          description: No encontrado
components:
  schemas:
    SpaceHabitatEclssLoopNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
