openapi: 3.1.0
info:
  title: ProyectoOmniPlanetaryMasterTwin API
  description: Gemelo Digital Planetario Maestro 13.0 que Integra 256 Clusters Industriales Globales
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoomniplanetarymastertwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoomniplanetarymastertwin/{id}:
    get:
      summary: Obtener OmniPlanetaryTensorGraphNexusNode por Identificador
      operationId: getOmniPlanetaryTensorGraphNexusNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OmniPlanetaryTensorGraphNexusNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniPlanetaryTensorGraphNexusNode'
        '404':
          description: No encontrado
components:
  schemas:
    OmniPlanetaryTensorGraphNexusNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
