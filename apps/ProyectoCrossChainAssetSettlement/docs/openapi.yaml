openapi: 3.1.0
info:
  title: ProyectoCrossChainAssetSettlement API
  description: Liquidacion Transfronteriza Interbancaria por Atomic Swaps HTLC
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocrosschainassetsettlement
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocrosschainassetsettlement/{id}:
    get:
      summary: Obtener HtlcAtomicSwapEscrowLockToken por Identificador
      operationId: getHtlcAtomicSwapEscrowLockTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HtlcAtomicSwapEscrowLockToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtlcAtomicSwapEscrowLockToken'
        '404':
          description: No encontrado
components:
  schemas:
    HtlcAtomicSwapEscrowLockToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
