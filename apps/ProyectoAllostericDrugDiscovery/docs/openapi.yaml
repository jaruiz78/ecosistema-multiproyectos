openapi: 3.1.0
info:
  title: ProyectoAllostericDrugDiscovery API
  description: Descubrimiento de Farmacos Alostericos de Alta Selectividad
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoallostericdrugdiscovery
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoallostericdrugdiscovery/{id}:
    get:
      summary: Obtener CrypticBindingPocketVolumeToken por Identificador
      operationId: getCrypticBindingPocketVolumeTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CrypticBindingPocketVolumeToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrypticBindingPocketVolumeToken'
        '404':
          description: No encontrado
components:
  schemas:
    CrypticBindingPocketVolumeToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
