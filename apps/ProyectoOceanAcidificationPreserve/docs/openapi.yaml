openapi: 3.1.0
info:
  title: ProyectoOceanAcidificationPreserve API
  description: Alerta Temprana de Acidificacion Oceanica y Proteccion de Marisqueo
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectooceanacidificationpreserve
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectooceanacidificationpreserve/{id}:
    get:
      summary: Obtener AragoniteSaturationStateOmegaNode por Identificador
      operationId: getAragoniteSaturationStateOmegaNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AragoniteSaturationStateOmegaNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AragoniteSaturationStateOmegaNode'
        '404':
          description: No encontrado
components:
  schemas:
    AragoniteSaturationStateOmegaNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
