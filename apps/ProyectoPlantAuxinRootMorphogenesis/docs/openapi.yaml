openapi: 3.1.0
info:
  title: ProyectoPlantAuxinRootMorphogenesis API
  description: Optimizacion Morfologica Radicular para Resistencia a la Sequia
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoplantauxinrootmorphogenesis
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoplantauxinrootmorphogenesis/{id}:
    get:
      summary: Obtener AuxinGradientMorphogenesisNode por Identificador
      operationId: getAuxinGradientMorphogenesisNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AuxinGradientMorphogenesisNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuxinGradientMorphogenesisNode'
        '404':
          description: No encontrado
components:
  schemas:
    AuxinGradientMorphogenesisNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
