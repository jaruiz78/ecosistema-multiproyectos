openapi: 3.1.0
info:
  title: ProyectoSuborbitalSpaceTourismTwin API
  description: Seguridad Biomecanica y Perfiles de Vuelo para Turismo Espacial Suborbital
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectosuborbitalspacetourismtwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectosuborbitalspacetourismtwin/{id}:
    get:
      summary: Obtener SpaceTourismPassengerGForceNode por Identificador
      operationId: getSpaceTourismPassengerGForceNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SpaceTourismPassengerGForceNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceTourismPassengerGForceNode'
        '404':
          description: No encontrado
components:
  schemas:
    SpaceTourismPassengerGForceNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
