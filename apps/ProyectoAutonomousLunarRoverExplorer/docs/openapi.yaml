openapi: 3.1.0
info:
  title: ProyectoAutonomousLunarRoverExplorer API
  description: Navegacion Autonoma de Rovers Lunares sobre Terreno Suelto
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoautonomouslunarroverexplorer
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoautonomouslunarroverexplorer/{id}:
    get:
      summary: Obtener RoverWheelSlipTerramechanicsNode por Identificador
      operationId: getRoverWheelSlipTerramechanicsNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: RoverWheelSlipTerramechanicsNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoverWheelSlipTerramechanicsNode'
        '404':
          description: No encontrado
components:
  schemas:
    RoverWheelSlipTerramechanicsNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
