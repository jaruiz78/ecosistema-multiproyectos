openapi: 3.1.0
info:
  title: ProyectoPhotonicOpticalCompute API
  description: Acelerador de Tensores Opticos y Multiplicacion Matricial por Coherencia Laser
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectophotonicopticalcompute
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectophotonicopticalcompute/{id}:
    get:
      summary: Obtener PhotonicInterferometerCoreNode por Identificador
      operationId: getPhotonicInterferometerCoreNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PhotonicInterferometerCoreNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotonicInterferometerCoreNode'
        '404':
          description: No encontrado
components:
  schemas:
    PhotonicInterferometerCoreNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
