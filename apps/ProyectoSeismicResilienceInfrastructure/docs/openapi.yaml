openapi: 3.1.0
info:
  title: ProyectoSeismicResilienceInfrastructure API
  description: Proteccion Antisismica de Infraestructuras Criticas con Metamateriales de Amortiguacion
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoseismicresilienceinfrastructure
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoseismicresilienceinfrastructure/{id}:
    get:
      summary: Obtener SeismicBaseIsolatorDisplacementNode por Identificador
      operationId: getSeismicBaseIsolatorDisplacementNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SeismicBaseIsolatorDisplacementNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeismicBaseIsolatorDisplacementNode'
        '404':
          description: No encontrado
components:
  schemas:
    SeismicBaseIsolatorDisplacementNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
