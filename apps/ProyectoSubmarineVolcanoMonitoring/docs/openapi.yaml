openapi: 3.1.0
info:
  title: ProyectoSubmarineVolcanoMonitoring API
  description: Vigilancia Hidroacustica y Alerta Temprana de Volcanes Submarinos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectosubmarinevolcanomonitoring
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectosubmarinevolcanomonitoring/{id}:
    get:
      summary: Obtener VolcanicHydroacousticSeismicNode por Identificador
      operationId: getVolcanicHydroacousticSeismicNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VolcanicHydroacousticSeismicNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolcanicHydroacousticSeismicNode'
        '404':
          description: No encontrado
components:
  schemas:
    VolcanicHydroacousticSeismicNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
