openapi: 3.1.0
info:
  title: ProyectoThresholdBlsOracleNetwork API
  description: Red de Oraculos Descentralizados con Firmas Umbral BLS Agregadas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectothresholdblsoraclenetwork
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectothresholdblsoraclenetwork/{id}:
    get:
      summary: Obtener BlsAggregatedSignatureDataFeedToken por Identificador
      operationId: getBlsAggregatedSignatureDataFeedTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: BlsAggregatedSignatureDataFeedToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlsAggregatedSignatureDataFeedToken'
        '404':
          description: No encontrado
components:
  schemas:
    BlsAggregatedSignatureDataFeedToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
