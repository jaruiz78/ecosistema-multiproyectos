openapi: 3.1.0
info:
  title: ProyectoQuantumTimeDistributionNetwork API
  description: Distribucion Cuantica de Tiempo Ultra-Precisa para Mercados Financieros y Redes 6G
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoquantumtimedistributionnetwork
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoquantumtimedistributionnetwork/{id}:
    get:
      summary: Obtener QuantumPicosecondClockSyncToken por Identificador
      operationId: getQuantumPicosecondClockSyncTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QuantumPicosecondClockSyncToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumPicosecondClockSyncToken'
        '404':
          description: No encontrado
components:
  schemas:
    QuantumPicosecondClockSyncToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
