openapi: 3.1.0
info:
  title: ProyectoEstuarineSalinityIntrusionTwin API
  description: Control de Intrusion Salina en Deltas y Tomas de Riego Costeras
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoestuarinesalinityintrusiontwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoestuarinesalinityintrusiontwin/{id}:
    get:
      summary: Obtener EstuarineSalinityIsohalineDistanceNode por Identificador
      operationId: getEstuarineSalinityIsohalineDistanceNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: EstuarineSalinityIsohalineDistanceNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstuarineSalinityIsohalineDistanceNode'
        '404':
          description: No encontrado
components:
  schemas:
    EstuarineSalinityIsohalineDistanceNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
