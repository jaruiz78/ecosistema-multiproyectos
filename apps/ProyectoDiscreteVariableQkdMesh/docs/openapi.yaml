openapi: 3.1.0
info:
  title: ProyectoDiscreteVariableQkdMesh API
  description: Redes Metropolitanas de Distribucion Cuantica de Claves DV-QKD
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectodiscretevariableqkdmesh
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectodiscretevariableqkdmesh/{id}:
    get:
      summary: Obtener DvQkdDecoyStateKeyStreamToken por Identificador
      operationId: getDvQkdDecoyStateKeyStreamTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DvQkdDecoyStateKeyStreamToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DvQkdDecoyStateKeyStreamToken'
        '404':
          description: No encontrado
components:
  schemas:
    DvQkdDecoyStateKeyStreamToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
