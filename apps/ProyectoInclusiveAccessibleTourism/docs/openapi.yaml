openapi: 3.1.0
info:
  title: ProyectoInclusiveAccessibleTourism API
  description: Plataforma de guiado y audiodescripción espacial 3D para turismo inclusivo y accesible
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoinclusiveaccessibletourism
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoinclusiveaccessibletourism/{id}:
    get:
      summary: Obtener AccessiblePoiNode por Identificador
      operationId: getAccessiblePoiNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AccessiblePoiNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessiblePoiNode'
        '404':
          description: No encontrado
components:
  schemas:
    AccessiblePoiNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
