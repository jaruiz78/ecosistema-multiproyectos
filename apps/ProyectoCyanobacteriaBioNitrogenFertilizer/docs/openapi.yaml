openapi: 3.1.0
info:
  title: ProyectoCyanobacteriaBioNitrogenFertilizer API
  description: Biofertilizantes Fototroficos de Nitrogeno con Cianobacterias
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocyanobacteriabionitrogenfertilizer
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocyanobacteriabionitrogenfertilizer/{id}:
    get:
      summary: Obtener HeterocystNitrogenaseFluxNode por Identificador
      operationId: getHeterocystNitrogenaseFluxNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HeterocystNitrogenaseFluxNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeterocystNitrogenaseFluxNode'
        '404':
          description: No encontrado
components:
  schemas:
    HeterocystNitrogenaseFluxNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
