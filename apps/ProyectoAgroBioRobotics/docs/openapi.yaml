openapi: 3.1.0
info:
  title: ProyectoAgroBioRobotics API
  description: Coordinación y gestión de enjambres de robots agrícolas autónomos y control biológico
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoagrobiorobotics
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoagrobiorobotics/{id}:
    get:
      summary: Obtener AgriRobotSwarmAgent por Identificador
      operationId: getAgriRobotSwarmAgentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AgriRobotSwarmAgent recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgriRobotSwarmAgent'
        '404':
          description: No encontrado
components:
  schemas:
    AgriRobotSwarmAgent:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
