openapi: 3.1.0
info:
  title: ProyectoSyntheticMicrobiomeRegen API
  description: Gemelo Digital de Microbioma del Suelo, Dinamica Bacteriana y Biofertilizantes de Precision
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectosyntheticmicrobiomeregen
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectosyntheticmicrobiomeregen/{id}:
    get:
      summary: Obtener SoilMicrobiomeMetabolicNode por Identificador
      operationId: getSoilMicrobiomeMetabolicNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SoilMicrobiomeMetabolicNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilMicrobiomeMetabolicNode'
        '404':
          description: No encontrado
components:
  schemas:
    SoilMicrobiomeMetabolicNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
