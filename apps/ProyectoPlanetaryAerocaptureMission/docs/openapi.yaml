openapi: 3.1.0
info:
  title: ProyectoPlanetaryAerocaptureMission API
  description: Maniobras de Aerocaptura Planetaria sin Consumo de Propelente
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoplanetaryaerocapturemission
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoplanetaryaerocapturemission/{id}:
    get:
      summary: Obtener AerocapturePeakHeatFluxTrajectoryNode por Identificador
      operationId: getAerocapturePeakHeatFluxTrajectoryNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AerocapturePeakHeatFluxTrajectoryNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AerocapturePeakHeatFluxTrajectoryNode'
        '404':
          description: No encontrado
components:
  schemas:
    AerocapturePeakHeatFluxTrajectoryNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
