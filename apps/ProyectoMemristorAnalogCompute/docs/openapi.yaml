openapi: 3.1.0
info:
  title: ProyectoMemristorAnalogCompute API
  description: Computacion Analogica In-Memory mediante Matrices Memristivas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomemristoranalogcompute
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomemristoranalogcompute/{id}:
    get:
      summary: Obtener MemristorCrossbarSynapseNode por Identificador
      operationId: getMemristorCrossbarSynapseNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MemristorCrossbarSynapseNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemristorCrossbarSynapseNode'
        '404':
          description: No encontrado
components:
  schemas:
    MemristorCrossbarSynapseNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
