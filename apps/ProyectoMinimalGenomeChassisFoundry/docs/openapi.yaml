openapi: 3.1.0
info:
  title: ProyectoMinimalGenomeChassisFoundry API
  description: Chasis Bacterianos Minimos para Biorrefinerias Libres de Carga Genomica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectominimalgenomechassisfoundry
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectominimalgenomechassisfoundry/{id}:
    get:
      summary: Obtener EssentialGeneSetCoverageToken por Identificador
      operationId: getEssentialGeneSetCoverageTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: EssentialGeneSetCoverageToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EssentialGeneSetCoverageToken'
        '404':
          description: No encontrado
components:
  schemas:
    EssentialGeneSetCoverageToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
