openapi: 3.1.0
info:
  title: ProyectoDeepSpaceSolarSailMission API
  description: Propulsion Fotonica sin Combustible mediante Velas Solares para Misiones Interplanetarias
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectodeepspacesolarsailmission
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectodeepspacesolarsailmission/{id}:
    get:
      summary: Obtener SolarSailAttitudeVectorNode por Identificador
      operationId: getSolarSailAttitudeVectorNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SolarSailAttitudeVectorNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolarSailAttitudeVectorNode'
        '404':
          description: No encontrado
components:
  schemas:
    SolarSailAttitudeVectorNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
