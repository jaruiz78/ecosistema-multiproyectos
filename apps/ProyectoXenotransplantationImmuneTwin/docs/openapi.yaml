openapi: 3.1.0
info:
  title: ProyectoXenotransplantationImmuneTwin API
  description: Compatibilidad Inmunogenomica para Xenotrasplante de Organos Bio-Ingenierizados
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoxenotransplantationimmunetwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoxenotransplantationimmunetwin/{id}:
    get:
      summary: Obtener XenoOrganCompatibilityScoreToken por Identificador
      operationId: getXenoOrganCompatibilityScoreTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: XenoOrganCompatibilityScoreToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XenoOrganCompatibilityScoreToken'
        '404':
          description: No encontrado
components:
  schemas:
    XenoOrganCompatibilityScoreToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
