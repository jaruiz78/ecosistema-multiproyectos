openapi: 3.1.0
info:
  title: ProyectoMantleGeodynamicsSimulator API
  description: Simulacion Geodinamica de Conveccion Mantélica y Tectonica de Placas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomantlegeodynamicssimulator
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomantlegeodynamicssimulator/{id}:
    get:
      summary: Obtener MantlePlumeThermalUpwellingNode por Identificador
      operationId: getMantlePlumeThermalUpwellingNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MantlePlumeThermalUpwellingNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MantlePlumeThermalUpwellingNode'
        '404':
          description: No encontrado
components:
  schemas:
    MantlePlumeThermalUpwellingNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
