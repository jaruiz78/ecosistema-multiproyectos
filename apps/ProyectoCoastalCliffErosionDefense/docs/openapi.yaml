openapi: 3.1.0
info:
  title: ProyectoCoastalCliffErosionDefense API
  description: Geomecanica de Erosion de Acantilados y Proteccion de Paseos Maritimos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocoastalclifferosiondefense
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocoastalclifferosiondefense/{id}:
    get:
      summary: Obtener CliffRetreatErosionRateNode por Identificador
      operationId: getCliffRetreatErosionRateNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CliffRetreatErosionRateNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliffRetreatErosionRateNode'
        '404':
          description: No encontrado
components:
  schemas:
    CliffRetreatErosionRateNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
