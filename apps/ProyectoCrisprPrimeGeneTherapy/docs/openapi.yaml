openapi: 3.1.0
info:
  title: ProyectoCrisprPrimeGeneTherapy API
  description: Diseno Computacional de Prime Editing y pegRNAs para Terapia Genica de Precision
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocrisprprimegenetherapy
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocrisprprimegenetherapy/{id}:
    get:
      summary: Obtener PrimeEditingTargetLocusToken por Identificador
      operationId: getPrimeEditingTargetLocusTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PrimeEditingTargetLocusToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimeEditingTargetLocusToken'
        '404':
          description: No encontrado
components:
  schemas:
    PrimeEditingTargetLocusToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
