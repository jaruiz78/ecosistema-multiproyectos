openapi: 3.1.0
info:
  title: ProyectoHydrodynamicDamFloodRouting API
  description: Modelizacion Hidrodinamica 2D de Rotura de Presas y Propagacion de Ondas de Crecida
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectohydrodynamicdamfloodrouting
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectohydrodynamicdamfloodrouting/{id}:
    get:
      summary: Obtener FloodInundationGridCellNode por Identificador
      operationId: getFloodInundationGridCellNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FloodInundationGridCellNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodInundationGridCellNode'
        '404':
          description: No encontrado
components:
  schemas:
    FloodInundationGridCellNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
