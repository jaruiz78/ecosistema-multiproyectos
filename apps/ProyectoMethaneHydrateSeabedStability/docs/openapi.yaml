openapi: 3.1.0
info:
  title: ProyectoMethaneHydrateSeabedStability API
  description: Monitorizacion de Estabilidad de Hidratos de Metano en Fondos Abisales
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomethanehydrateseabedstability
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomethanehydrateseabedstability/{id}:
    get:
      summary: Obtener MethaneClathratePhaseBoundaryNode por Identificador
      operationId: getMethaneClathratePhaseBoundaryNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MethaneClathratePhaseBoundaryNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethaneClathratePhaseBoundaryNode'
        '404':
          description: No encontrado
components:
  schemas:
    MethaneClathratePhaseBoundaryNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
