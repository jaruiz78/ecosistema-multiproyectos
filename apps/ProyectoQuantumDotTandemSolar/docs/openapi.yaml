openapi: 3.1.0
info:
  title: ProyectoQuantumDotTandemSolar API
  description: Parques Solares Tandem de Puntos Cuanticos y Maximizacion de Eficiencia Espectral
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoquantumdottandemsolar
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoquantumdottandemsolar/{id}:
    get:
      summary: Obtener QuantumDotSolarCellBatch por Identificador
      operationId: getQuantumDotSolarCellBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QuantumDotSolarCellBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumDotSolarCellBatch'
        '404':
          description: No encontrado
components:
  schemas:
    QuantumDotSolarCellBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
