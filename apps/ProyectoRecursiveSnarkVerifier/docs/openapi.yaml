openapi: 3.1.0
info:
  title: ProyectoRecursiveSnarkVerifier API
  description: Verificacion Masiva Recursiva de Pruebas ZK-SNARK Halo2 para Identidad
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectorecursivesnarkverifier
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectorecursivesnarkverifier/{id}:
    get:
      summary: Obtener Halo2ProofAggregationBatchToken por Identificador
      operationId: getHalo2ProofAggregationBatchTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Halo2ProofAggregationBatchToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Halo2ProofAggregationBatchToken'
        '404':
          description: No encontrado
components:
  schemas:
    Halo2ProofAggregationBatchToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
