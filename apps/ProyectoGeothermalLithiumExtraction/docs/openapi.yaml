openapi: 3.1.0
info:
  title: ProyectoGeothermalLithiumExtraction API
  description: Extraccion Directa de Litio Sostenible a partir de Salmueras Geotermicas Profundas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectogeothermallithiumextraction
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectogeothermallithiumextraction/{id}:
    get:
      summary: Obtener GeothermalBrineLithiumYieldToken por Identificador
      operationId: getGeothermalBrineLithiumYieldTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GeothermalBrineLithiumYieldToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeothermalBrineLithiumYieldToken'
        '404':
          description: No encontrado
components:
  schemas:
    GeothermalBrineLithiumYieldToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
