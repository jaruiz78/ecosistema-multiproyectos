openapi: 3.1.0
info:
  title: ProyectoSolidStateBatteryStorage API
  description: Baterias de Estado Solido y Prevencion de Dendritas de Litio para Almacenamiento Grid
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectosolidstatebatterystorage
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectosolidstatebatterystorage/{id}:
    get:
      summary: Obtener SolidStateElectrolyteCellBatch por Identificador
      operationId: getSolidStateElectrolyteCellBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SolidStateElectrolyteCellBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolidStateElectrolyteCellBatch'
        '404':
          description: No encontrado
components:
  schemas:
    SolidStateElectrolyteCellBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
