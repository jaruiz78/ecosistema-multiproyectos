openapi: 3.1.0
info:
  title: ProyectoStratosphericSAI API
  description: Modelado estocástico de inyección de aerosoles estratosféricos y albedo solar planetario
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectostratosphericsai
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectostratosphericsai/{id}:
    get:
      summary: Obtener AerosolInjectionPlume por Identificador
      operationId: getAerosolInjectionPlumeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AerosolInjectionPlume recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AerosolInjectionPlume'
        '404':
          description: No encontrado
components:
  schemas:
    AerosolInjectionPlume:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
