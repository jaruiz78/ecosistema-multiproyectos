openapi: 3.1.0
info:
  title: ProyectoDnaArchivalDataStorage API
  description: Almacenamiento Digital Masivo en ADN Sintetico con Codigos de Fuente Fountain
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectodnaarchivaldatastorage
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectodnaarchivaldatastorage/{id}:
    get:
      summary: Obtener DnaOligonucleotideDataBlockToken por Identificador
      operationId: getDnaOligonucleotideDataBlockTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DnaOligonucleotideDataBlockToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnaOligonucleotideDataBlockToken'
        '404':
          description: No encontrado
components:
  schemas:
    DnaOligonucleotideDataBlockToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
