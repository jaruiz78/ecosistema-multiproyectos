openapi: 3.1.0
info:
  title: ProyectoCubeSatConstellationAdcs API
  description: Control de Apuntamiento de Alta Precision para Constelaciones CubeSat
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocubesatconstellationadcs
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocubesatconstellationadcs/{id}:
    get:
      summary: Obtener CubesatAttitudeQuaternionPointingNode por Identificador
      operationId: getCubesatAttitudeQuaternionPointingNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CubesatAttitudeQuaternionPointingNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CubesatAttitudeQuaternionPointingNode'
        '404':
          description: No encontrado
components:
  schemas:
    CubesatAttitudeQuaternionPointingNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
