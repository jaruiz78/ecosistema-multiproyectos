openapi: 3.1.0
info:
  title: ProyectoHyporheicWaterPurification API
  description: Depuracion Natural de Aguas Fluviales mediante la Zona Hiporreica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectohyporheicwaterpurification
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectohyporheicwaterpurification/{id}:
    get:
      summary: Obtener HyporheicNitrateDenitrificationNode por Identificador
      operationId: getHyporheicNitrateDenitrificationNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HyporheicNitrateDenitrificationNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HyporheicNitrateDenitrificationNode'
        '404':
          description: No encontrado
components:
  schemas:
    HyporheicNitrateDenitrificationNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
