openapi: 3.1.0
info:
  title: ProyectoAstroturismoStarlight API
  description: Red de astroturismo, reservas para observatorios y certificación de cielos limpios Starlight
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoastroturismostarlight
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoastroturismostarlight/{id}:
    get:
      summary: Obtener StarlightObservationPoint por Identificador
      operationId: getStarlightObservationPointById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: StarlightObservationPoint recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarlightObservationPoint'
        '404':
          description: No encontrado
components:
  schemas:
    StarlightObservationPoint:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
