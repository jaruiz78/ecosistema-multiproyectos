openapi: 3.1.0
info:
  title: ProyectoMicrogravityBiotechLaboratory API
  description: Plataforma de Experimentacion Biotecnologica en Microgravedad Parabolica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomicrogravitybiotechlaboratory
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomicrogravitybiotechlaboratory/{id}:
    get:
      summary: Obtener MicrogravityGProfileAccelerationNode por Identificador
      operationId: getMicrogravityGProfileAccelerationNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MicrogravityGProfileAccelerationNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrogravityGProfileAccelerationNode'
        '404':
          description: No encontrado
components:
  schemas:
    MicrogravityGProfileAccelerationNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
