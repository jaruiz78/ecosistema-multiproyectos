openapi: 3.1.0
info:
  title: ProyectoUrbanEnergyMobilityNexus API
  description: Orquestador de Nexo Urbano Energia-Movilidad V2G y Microredes Hoteleras
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectourbanenergymobilitynexus
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectourbanenergymobilitynexus/{id}:
    get:
      summary: Obtener V2GChargingDispatchNode por Identificador
      operationId: getV2GChargingDispatchNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: V2GChargingDispatchNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2GChargingDispatchNode'
        '404':
          description: No encontrado
components:
  schemas:
    V2GChargingDispatchNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
