openapi: 3.1.0
info:
  title: ProyectoMicroalgaeCarbonBiofuel API
  description: Fotobiorreactores de Microalgas para Fijacion de CO2 y Produccion de Biocombustibles
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomicroalgaecarbonbiofuel
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomicroalgaecarbonbiofuel/{id}:
    get:
      summary: Obtener AlgaeBioreactorCultureBatch por Identificador
      operationId: getAlgaeBioreactorCultureBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AlgaeBioreactorCultureBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgaeBioreactorCultureBatch'
        '404':
          description: No encontrado
components:
  schemas:
    AlgaeBioreactorCultureBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
