openapi: 3.1.0
info:
  title: ProyectoSpintronicTerahertzEmitter API
  description: Fuentes de Radiacion Terahercica Espintronica para Inspeccion No Destructiva
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectospintronicterahertzemitter
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectospintronicterahertzemitter/{id}:
    get:
      summary: Obtener SpintronicThzPulseWaveformNode por Identificador
      operationId: getSpintronicThzPulseWaveformNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SpintronicThzPulseWaveformNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpintronicThzPulseWaveformNode'
        '404':
          description: No encontrado
components:
  schemas:
    SpintronicThzPulseWaveformNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
