openapi: 3.1.0
info:
  title: ProyectoAlgalBiodieselRefinery API
  description: Refinerias de Biodiesel Sostenible a partir de Biomasa de Microalgas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoalgalbiodieselrefinery
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoalgalbiodieselrefinery/{id}:
    get:
      summary: Obtener LipidToBiodieselYieldConversionToken por Identificador
      operationId: getLipidToBiodieselYieldConversionTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: LipidToBiodieselYieldConversionToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LipidToBiodieselYieldConversionToken'
        '404':
          description: No encontrado
components:
  schemas:
    LipidToBiodieselYieldConversionToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
