openapi: 3.1.0
info:
  title: ProyectoDeepGeothermalEnergyTwin API
  description: Gemelo Digital de Sistemas Geotermicos Estimulados Profundos (EGS) y Generacion de Vapor
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectodeepgeothermalenergytwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectodeepgeothermalenergytwin/{id}:
    get:
      summary: Obtener GeothermalBoreholeHeatExchangerNode por Identificador
      operationId: getGeothermalBoreholeHeatExchangerNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GeothermalBoreholeHeatExchangerNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeothermalBoreholeHeatExchangerNode'
        '404':
          description: No encontrado
components:
  schemas:
    GeothermalBoreholeHeatExchangerNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
