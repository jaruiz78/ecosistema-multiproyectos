openapi: 3.1.0
info:
  title: ProyectoSpintronicPersistentMemory API
  description: Caches Persistentes No Volatiles Basadas en Transferencia de Par de Espin (STT-MRAM)
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectospintronicpersistentmemory
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectospintronicpersistentmemory/{id}:
    get:
      summary: Obtener SpinTorqueTransferCacheToken por Identificador
      operationId: getSpinTorqueTransferCacheTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SpinTorqueTransferCacheToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpinTorqueTransferCacheToken'
        '404':
          description: No encontrado
components:
  schemas:
    SpinTorqueTransferCacheToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
