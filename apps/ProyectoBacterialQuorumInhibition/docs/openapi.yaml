openapi: 3.1.0
info:
  title: ProyectoBacterialQuorumInhibition API
  description: Control Ecologico de Biopeliculas y Patogenos Agricolas sin Antibioticos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectobacterialquoruminhibition
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectobacterialquoruminhibition/{id}:
    get:
      summary: Obtener AutoinducerSignalingBlockadeNode por Identificador
      operationId: getAutoinducerSignalingBlockadeNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AutoinducerSignalingBlockadeNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoinducerSignalingBlockadeNode'
        '404':
          description: No encontrado
components:
  schemas:
    AutoinducerSignalingBlockadeNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
