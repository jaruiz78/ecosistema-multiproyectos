openapi: 3.1.0
info:
  title: ProyectoPhotonicCrystalWaveguide API
  description: Nanofotonica de Cristales Fotonicos para Conmutacion Optica Ultra-Rapida
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectophotoniccrystalwaveguide
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectophotoniccrystalwaveguide/{id}:
    get:
      summary: Obtener PhotonicWaveguideCouplerNode por Identificador
      operationId: getPhotonicWaveguideCouplerNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PhotonicWaveguideCouplerNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotonicWaveguideCouplerNode'
        '404':
          description: No encontrado
components:
  schemas:
    PhotonicWaveguideCouplerNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
