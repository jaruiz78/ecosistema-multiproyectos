openapi: 3.1.0
info:
  title: ProyectoAutonomousEcosystemDao API
  description: Gobernanza Institucional Descentralizada con Voto Cuadratico y Futarquia
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoautonomousecosystemdao
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoautonomousecosystemdao/{id}:
    get:
      summary: Obtener QuadraticVotingProposalTallyNode por Identificador
      operationId: getQuadraticVotingProposalTallyNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QuadraticVotingProposalTallyNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadraticVotingProposalTallyNode'
        '404':
          description: No encontrado
components:
  schemas:
    QuadraticVotingProposalTallyNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
