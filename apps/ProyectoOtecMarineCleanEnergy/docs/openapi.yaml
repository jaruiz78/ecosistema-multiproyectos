openapi: 3.1.0
info:
  title: ProyectoOtecMarineCleanEnergy API
  description: Generacion Energetica Continua mediante Gradiente Termico Oceanico (OTEC)
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectootecmarinecleanenergy
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectootecmarinecleanenergy/{id}:
    get:
      summary: Obtener OtecThermalGradientTurbineNode por Identificador
      operationId: getOtecThermalGradientTurbineNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OtecThermalGradientTurbineNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtecThermalGradientTurbineNode'
        '404':
          description: No encontrado
components:
  schemas:
    OtecThermalGradientTurbineNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
