openapi: 3.1.0
info:
  title: ProyectoConfidentialDataCleanRoom API
  description: Salas Limpias Confidenciales para Comparticion de Datos entre Competidores
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoconfidentialdatacleanroom
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoconfidentialdatacleanroom/{id}:
    get:
      summary: Obtener SecureEnclaveAnalyticsAttestationToken por Identificador
      operationId: getSecureEnclaveAnalyticsAttestationTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SecureEnclaveAnalyticsAttestationToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureEnclaveAnalyticsAttestationToken'
        '404':
          description: No encontrado
components:
  schemas:
    SecureEnclaveAnalyticsAttestationToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
