openapi: 3.1.0
info:
  title: ProyectoLunarGatewayOrbitStation API
  description: Mantenimiento y Transferencia a Orbitas Halo NRHO para Estaciones Lunares
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectolunargatewayorbitstation
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectolunargatewayorbitstation/{id}:
    get:
      summary: Obtener NrhoJacobiConstantStabilityNode por Identificador
      operationId: getNrhoJacobiConstantStabilityNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: NrhoJacobiConstantStabilityNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NrhoJacobiConstantStabilityNode'
        '404':
          description: No encontrado
components:
  schemas:
    NrhoJacobiConstantStabilityNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
