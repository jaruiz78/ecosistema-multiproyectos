openapi: 3.1.0
info:
  title: ProyectoEnoturismoRutasVino API
  description: Plataforma de viticultura de precisión, fenología predictiva y reservas enoturísticas
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoenoturismorutasvino
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoenoturismorutasvino/{id}:
    get:
      summary: Obtener VineyardParcelBooking por Identificador
      operationId: getVineyardParcelBookingById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VineyardParcelBooking recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VineyardParcelBooking'
        '404':
          description: No encontrado
components:
  schemas:
    VineyardParcelBooking:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
