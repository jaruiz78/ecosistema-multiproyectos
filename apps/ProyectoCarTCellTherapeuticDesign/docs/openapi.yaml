openapi: 3.1.0
info:
  title: ProyectoCarTCellTherapeuticDesign API
  description: Inmunoterapia de Precision y Modelado Celular CAR-T
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocartcelltherapeuticdesign
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocartcelltherapeuticdesign/{id}:
    get:
      summary: Obtener CarTScfvBindingAffinityToken por Identificador
      operationId: getCarTScfvBindingAffinityTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CarTScfvBindingAffinityToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarTScfvBindingAffinityToken'
        '404':
          description: No encontrado
components:
  schemas:
    CarTScfvBindingAffinityToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
