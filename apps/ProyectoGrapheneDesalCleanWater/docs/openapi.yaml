openapi: 3.1.0
info:
  title: ProyectoGrapheneDesalCleanWater API
  description: Desalinizacion Eficiente mediante Membranas Nanoporosas de Grafeno y Electrodiálisis
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectographenedesalcleanwater
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectographenedesalcleanwater/{id}:
    get:
      summary: Obtener GrapheneNanoporeMembraneBatch por Identificador
      operationId: getGrapheneNanoporeMembraneBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GrapheneNanoporeMembraneBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrapheneNanoporeMembraneBatch'
        '404':
          description: No encontrado
components:
  schemas:
    GrapheneNanoporeMembraneBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
