openapi: 3.1.0
info:
  title: ProyectoDragFreeGeodesyMission API
  description: Misiones Geodesicas Satelitales Libres de Resistencia Aerodinamica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectodragfreegeodesymission
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectodragfreegeodesymission/{id}:
    get:
      summary: Obtener TestMassDisplacementResidualAccelerationNode por Identificador
      operationId: getTestMassDisplacementResidualAccelerationNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TestMassDisplacementResidualAccelerationNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMassDisplacementResidualAccelerationNode'
        '404':
          description: No encontrado
components:
  schemas:
    TestMassDisplacementResidualAccelerationNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
