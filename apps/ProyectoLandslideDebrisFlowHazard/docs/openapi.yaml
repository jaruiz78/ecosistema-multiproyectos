openapi: 3.1.0
info:
  title: ProyectoLandslideDebrisFlowHazard API
  description: Zonificacion de Riesgo y Alerta de Deslizamientos de Ladera
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectolandslidedebrisflowhazard
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectolandslidedebrisflowhazard/{id}:
    get:
      summary: Obtener DebrisFlowRunoutVelocityImpactNode por Identificador
      operationId: getDebrisFlowRunoutVelocityImpactNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DebrisFlowRunoutVelocityImpactNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebrisFlowRunoutVelocityImpactNode'
        '404':
          description: No encontrado
components:
  schemas:
    DebrisFlowRunoutVelocityImpactNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
