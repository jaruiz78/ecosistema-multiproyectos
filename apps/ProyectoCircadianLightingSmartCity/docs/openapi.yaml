openapi: 3.1.0
info:
  title: ProyectoCircadianLightingSmartCity API
  description: Alumbrado Inteligente Centrado en el Ser Humano (HCL) para Ciudades y Hospitales
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocircadianlightingsmartcity
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocircadianlightingsmartcity/{id}:
    get:
      summary: Obtener CircadianLightingMelanopicNode por Identificador
      operationId: getCircadianLightingMelanopicNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CircadianLightingMelanopicNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircadianLightingMelanopicNode'
        '404':
          description: No encontrado
components:
  schemas:
    CircadianLightingMelanopicNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
