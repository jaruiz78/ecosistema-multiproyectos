openapi: 3.1.0
info:
  title: ProyectoInterplanetaryDelayTolerantRelay API
  description: Red de Comunicaciones Interplanetarias Tolerante a Demoras (DTN)
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectointerplanetarydelaytolerantrelay
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectointerplanetarydelaytolerantrelay/{id}:
    get:
      summary: Obtener DtnBundleCustodyTransferToken por Identificador
      operationId: getDtnBundleCustodyTransferTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DtnBundleCustodyTransferToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtnBundleCustodyTransferToken'
        '404':
          description: No encontrado
components:
  schemas:
    DtnBundleCustodyTransferToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
