openapi: 3.1.0
info:
  title: ProyectoMarineBioAcousticsSonar API
  description: Red Bioacustica Marina e Hidrofonos Pasivos para Proteccion de Cetaceos y Posidonia
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomarinebioacousticssonar
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomarinebioacousticssonar/{id}:
    get:
      summary: Obtener HydrophoneAcousticPulseNode por Identificador
      operationId: getHydrophoneAcousticPulseNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HydrophoneAcousticPulseNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HydrophoneAcousticPulseNode'
        '404':
          description: No encontrado
components:
  schemas:
    HydrophoneAcousticPulseNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
