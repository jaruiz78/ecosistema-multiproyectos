openapi: 3.1.0
info:
  title: ProyectoGreenHydrogenDesal API
  description: Desalinización sostenible por ósmosis inversa acoplada a producción de hidrógeno verde costero
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectogreenhydrogendesal
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectogreenhydrogendesal/{id}:
    get:
      summary: Obtener DesalinationElectrolyzerUnit por Identificador
      operationId: getDesalinationElectrolyzerUnitById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DesalinationElectrolyzerUnit recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesalinationElectrolyzerUnit'
        '404':
          description: No encontrado
components:
  schemas:
    DesalinationElectrolyzerUnit:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
