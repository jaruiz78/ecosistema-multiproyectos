openapi: 3.1.0
info:
  title: ProyectoPhageDisplayDirectedEvolution API
  description: Optimizacion Evolutiva Continua de Anticuerpos Sinteticos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectophagedisplaydirectedevolution
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectophagedisplaydirectedevolution/{id}:
    get:
      summary: Obtener PhageDisplayAffinityEnrichmentToken por Identificador
      operationId: getPhageDisplayAffinityEnrichmentTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PhageDisplayAffinityEnrichmentToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhageDisplayAffinityEnrichmentToken'
        '404':
          description: No encontrado
components:
  schemas:
    PhageDisplayAffinityEnrichmentToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
