openapi: 3.1.0
info:
  title: ProyectoGlacierMeltIceCapMonitor API
  description: Monitorizacion Radar de Deshielo Glaciar y Dinamica de Masas de Hielo Polar
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoglaciermelticecapmonitor
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoglaciermelticecapmonitor/{id}:
    get:
      summary: Obtener GlacierBedrockIceThicknessNode por Identificador
      operationId: getGlacierBedrockIceThicknessNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GlacierBedrockIceThicknessNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlacierBedrockIceThicknessNode'
        '404':
          description: No encontrado
components:
  schemas:
    GlacierBedrockIceThicknessNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
