openapi: 3.1.0
info:
  title: ProyectoMicroSatKaBandSarConstellation API
  description: Constelaciones de Micro-Satelites SAR en Banda Ka para Imagen Diaria
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomicrosatkabandsarconstellation
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomicrosatkabandsarconstellation/{id}:
    get:
      summary: Obtener KaBandSarImageResolutionGridNode por Identificador
      operationId: getKaBandSarImageResolutionGridNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: KaBandSarImageResolutionGridNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KaBandSarImageResolutionGridNode'
        '404':
          description: No encontrado
components:
  schemas:
    KaBandSarImageResolutionGridNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
