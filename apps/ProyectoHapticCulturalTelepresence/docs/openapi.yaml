openapi: 3.1.0
info:
  title: ProyectoHapticCulturalTelepresence API
  description: Telepresencia Haptica Espacial y Experiencias Culturales Inmersivas de Patrimonio
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectohapticculturaltelepresence
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectohapticculturaltelepresence/{id}:
    get:
      summary: Obtener HapticExperienceStreamToken por Identificador
      operationId: getHapticExperienceStreamTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HapticExperienceStreamToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HapticExperienceStreamToken'
        '404':
          description: No encontrado
components:
  schemas:
    HapticExperienceStreamToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
