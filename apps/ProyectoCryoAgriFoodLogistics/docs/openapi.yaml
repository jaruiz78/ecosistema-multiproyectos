openapi: 3.1.0
info:
  title: ProyectoCryoAgriFoodLogistics API
  description: Logistica de Cadena de Frio Ultra-Criogenica y Liofilizacion Agroalimentaria
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectocryoagrifoodlogistics
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectocryoagrifoodlogistics/{id}:
    get:
      summary: Obtener CryogenicTelemetryBatchNode por Identificador
      operationId: getCryogenicTelemetryBatchNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CryogenicTelemetryBatchNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryogenicTelemetryBatchNode'
        '404':
          description: No encontrado
components:
  schemas:
    CryogenicTelemetryBatchNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
