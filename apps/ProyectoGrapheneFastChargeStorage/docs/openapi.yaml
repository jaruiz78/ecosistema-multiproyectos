openapi: 3.1.0
info:
  title: ProyectoGrapheneFastChargeStorage API
  description: Almacenamiento Ultra-Rapido de Energia con Supercondensadores de Grafeno
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectographenefastchargestorage
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectographenefastchargestorage/{id}:
    get:
      summary: Obtener GrapheneSupercapacitorCellBatch por Identificador
      operationId: getGrapheneSupercapacitorCellBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GrapheneSupercapacitorCellBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrapheneSupercapacitorCellBatch'
        '404':
          description: No encontrado
components:
  schemas:
    GrapheneSupercapacitorCellBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
