openapi: 3.1.0
info:
  title: ProyectoZeroKnowledgeCreditRating API
  description: Scoring Crediticio Soberano con Pruebas de Conocimiento Cero
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectozeroknowledgecreditrating
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectozeroknowledgecreditrating/{id}:
    get:
      summary: Obtener ZkCreditEligibilityProofToken por Identificador
      operationId: getZkCreditEligibilityProofTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ZkCreditEligibilityProofToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZkCreditEligibilityProofToken'
        '404':
          description: No encontrado
components:
  schemas:
    ZkCreditEligibilityProofToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
