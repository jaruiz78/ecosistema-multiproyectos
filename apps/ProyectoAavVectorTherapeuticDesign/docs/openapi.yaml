openapi: 3.1.0
info:
  title: ProyectoAavVectorTherapeuticDesign API
  description: Ingenieria de Capsides AAV de Tropismo Especifico para Terapia Genica Dirigida
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoaavvectortherapeuticdesign
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoaavvectortherapeuticdesign/{id}:
    get:
      summary: Obtener AavCapsidTropismVectorToken por Identificador
      operationId: getAavCapsidTropismVectorTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AavCapsidTropismVectorToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AavCapsidTropismVectorToken'
        '404':
          description: No encontrado
components:
  schemas:
    AavCapsidTropismVectorToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
