openapi: 3.1.0
info:
  title: ProyectoAutonomousOceanGliders API
  description: Flota de Planeadores Submarinos Autonomos (AUV) para Exploracion Oceanografica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoautonomousoceangliders
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoautonomousoceangliders/{id}:
    get:
      summary: Obtener AuvSubmarineTrackWaypointNode por Identificador
      operationId: getAuvSubmarineTrackWaypointNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AuvSubmarineTrackWaypointNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuvSubmarineTrackWaypointNode'
        '404':
          description: No encontrado
components:
  schemas:
    AuvSubmarineTrackWaypointNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
