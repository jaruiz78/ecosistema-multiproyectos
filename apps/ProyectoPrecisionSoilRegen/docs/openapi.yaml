openapi: 3.1.0
info:
  title: ProyectoPrecisionSoilRegen API
  description: Monitoreo microbiológico, NDVI y secuestro de carbono orgánico en suelos agrícolas (MRV)
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoprecisionsoilregen
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoprecisionsoilregen/{id}:
    get:
      summary: Obtener SoilCarbonMeasurement por Identificador
      operationId: getSoilCarbonMeasurementById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SoilCarbonMeasurement recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilCarbonMeasurement'
        '404':
          description: No encontrado
components:
  schemas:
    SoilCarbonMeasurement:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
