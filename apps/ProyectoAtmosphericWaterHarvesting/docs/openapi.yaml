openapi: 3.1.0
info:
  title: ProyectoAtmosphericWaterHarvesting API
  description: Generacion Atmosferica de Agua Potable mediante Materiales Porosos MOF en Climas Aridos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoatmosphericwaterharvesting
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoatmosphericwaterharvesting/{id}:
    get:
      summary: Obtener MofWaterAdsorptionChamberNode por Identificador
      operationId: getMofWaterAdsorptionChamberNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MofWaterAdsorptionChamberNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MofWaterAdsorptionChamberNode'
        '404':
          description: No encontrado
components:
  schemas:
    MofWaterAdsorptionChamberNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
