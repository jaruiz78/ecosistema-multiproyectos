openapi: 3.1.0
info:
  title: ProyectoNuclearThermalPropulsionTwin API
  description: Propulsion Termica Nuclear para Viajes Interplanetarios de Alta Velocidad
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectonuclearthermalpropulsiontwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectonuclearthermalpropulsiontwin/{id}:
    get:
      summary: Obtener NtpSpecificImpulseThrustVectorNode por Identificador
      operationId: getNtpSpecificImpulseThrustVectorNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: NtpSpecificImpulseThrustVectorNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NtpSpecificImpulseThrustVectorNode'
        '404':
          description: No encontrado
components:
  schemas:
    NtpSpecificImpulseThrustVectorNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
