openapi: 3.1.0
info:
  title: ProyectoLunarOxygenIsruPlant API
  description: Plantas de Extraccion In-Situ de Oxigeno (ISRU) en la Luna
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectolunaroxygenisruplant
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectolunaroxygenisruplant/{id}:
    get:
      summary: Obtener RegolithOxygenExtractionRateYieldToken por Identificador
      operationId: getRegolithOxygenExtractionRateYieldTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: RegolithOxygenExtractionRateYieldToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegolithOxygenExtractionRateYieldToken'
        '404':
          description: No encontrado
components:
  schemas:
    RegolithOxygenExtractionRateYieldToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
