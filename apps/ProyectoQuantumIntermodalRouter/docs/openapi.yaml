openapi: 3.1.0
info:
  title: ProyectoQuantumIntermodalRouter API
  description: Ruteador Logistico Intermodal Cuantico Optimizado mediante Formulaciones QUBO
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoquantumintermodalrouter
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoquantumintermodalrouter/{id}:
    get:
      summary: Obtener QuboIntermodalRouteGraphNode por Identificador
      operationId: getQuboIntermodalRouteGraphNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: QuboIntermodalRouteGraphNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuboIntermodalRouteGraphNode'
        '404':
          description: No encontrado
components:
  schemas:
    QuboIntermodalRouteGraphNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
