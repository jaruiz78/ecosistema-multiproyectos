openapi: 3.1.0
info:
  title: ProyectoAptamerDiagnosticBiosensors API
  description: Biosensores Diagnosticos basados en Aptameros Sinteticos SELEX
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoaptamerdiagnosticbiosensors
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoaptamerdiagnosticbiosensors/{id}:
    get:
      summary: Obtener AptamerDissociationConstantKdToken por Identificador
      operationId: getAptamerDissociationConstantKdTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AptamerDissociationConstantKdToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AptamerDissociationConstantKdToken'
        '404':
          description: No encontrado
components:
  schemas:
    AptamerDissociationConstantKdToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
