openapi: 3.1.0
info:
  title: ProyectoSingleCellSpatialOmics API
  description: Mapeo Transcriptomico Espacial Celular para Oncologia de Precision y Agro-Genomica
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectosinglecellspatialomics
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectosinglecellspatialomics/{id}:
    get:
      summary: Obtener SpatialTranscriptomeCellSpotNode por Identificador
      operationId: getSpatialTranscriptomeCellSpotNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SpatialTranscriptomeCellSpotNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpatialTranscriptomeCellSpotNode'
        '404':
          description: No encontrado
components:
  schemas:
    SpatialTranscriptomeCellSpotNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
