openapi: 3.1.0
info:
  title: ProyectoLiquidMetalSoftElectronics API
  description: Electronica Blanda Reconfigurable de Metal Liquido para Robotica Marina
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoliquidmetalsoftelectronics
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoliquidmetalsoftelectronics/{id}:
    get:
      summary: Obtener LiquidMetalConductorTraceBatch por Identificador
      operationId: getLiquidMetalConductorTraceBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: LiquidMetalConductorTraceBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidMetalConductorTraceBatch'
        '404':
          description: No encontrado
components:
  schemas:
    LiquidMetalConductorTraceBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
