openapi: 3.1.0
info:
  title: ProyectoConcentratedLiquidityAmm API
  description: Creadores de Mercado Automatizados de Liquidez Concentrada para Recursos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoconcentratedliquidityamm
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoconcentratedliquidityamm/{id}:
    get:
      summary: Obtener AmmLiquidityPoolPositionNode por Identificador
      operationId: getAmmLiquidityPoolPositionNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AmmLiquidityPoolPositionNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmmLiquidityPoolPositionNode'
        '404':
          description: No encontrado
components:
  schemas:
    AmmLiquidityPoolPositionNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
