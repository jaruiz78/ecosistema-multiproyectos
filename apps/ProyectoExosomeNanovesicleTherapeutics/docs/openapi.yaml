openapi: 3.1.0
info:
  title: ProyectoExosomeNanovesicleTherapeutics API
  description: Terapia Dirigida con Exosomas Autologos para Ensayos Clinicos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoexosomenanovesicletherapeutics
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoexosomenanovesicletherapeutics/{id}:
    get:
      summary: Obtener ExosomeSurfaceMarkerTropismNode por Identificador
      operationId: getExosomeSurfaceMarkerTropismNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ExosomeSurfaceMarkerTropismNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExosomeSurfaceMarkerTropismNode'
        '404':
          description: No encontrado
components:
  schemas:
    ExosomeSurfaceMarkerTropismNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
