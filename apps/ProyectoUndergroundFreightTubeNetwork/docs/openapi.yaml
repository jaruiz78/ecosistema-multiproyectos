openapi: 3.1.0
info:
  title: ProyectoUndergroundFreightTubeNetwork API
  description: Transporte Logistico Subterraneo Autonomo de Mercancias para Descongestionar Ciudades
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoundergroundfreighttubenetwork
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoundergroundfreighttubenetwork/{id}:
    get:
      summary: Obtener UndergroundFreightCapsuleTrackNode por Identificador
      operationId: getUndergroundFreightCapsuleTrackNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: UndergroundFreightCapsuleTrackNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndergroundFreightCapsuleTrackNode'
        '404':
          description: No encontrado
components:
  schemas:
    UndergroundFreightCapsuleTrackNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
