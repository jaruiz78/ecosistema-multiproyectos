openapi: 3.1.0
info:
  title: ProyectoMagnetocaloricGreenCooling API
  description: Refrigeracion Magnetocalorica Ecologica sin Emisiones para Cadena de Frio
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectomagnetocaloricgreencooling
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectomagnetocaloricgreencooling/{id}:
    get:
      summary: Obtener MagnetocaloricRegeneratorBedNode por Identificador
      operationId: getMagnetocaloricRegeneratorBedNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MagnetocaloricRegeneratorBedNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagnetocaloricRegeneratorBedNode'
        '404':
          description: No encontrado
components:
  schemas:
    MagnetocaloricRegeneratorBedNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
