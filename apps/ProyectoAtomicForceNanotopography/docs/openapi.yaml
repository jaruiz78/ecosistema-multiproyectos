openapi: 3.1.0
info:
  title: ProyectoAtomicForceNanotopography API
  description: Nanometrologia y Caracterizacion Topografica por Microscopia AFM
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoatomicforcenanotopography
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoatomicforcenanotopography/{id}:
    get:
      summary: Obtener AfmCantileverDeflectionScanNode por Identificador
      operationId: getAfmCantileverDeflectionScanNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AfmCantileverDeflectionScanNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfmCantileverDeflectionScanNode'
        '404':
          description: No encontrado
components:
  schemas:
    AfmCantileverDeflectionScanNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
