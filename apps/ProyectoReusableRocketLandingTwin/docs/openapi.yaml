openapi: 3.1.0
info:
  title: ProyectoReusableRocketLandingTwin API
  description: Guiado Convexificado y Aterrizaje Vertical Autonomo de Cohetes Reutilizables
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoreusablerocketlandingtwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoreusablerocketlandingtwin/{id}:
    get:
      summary: Obtener RocketRetroLandingTrajectoryNode por Identificador
      operationId: getRocketRetroLandingTrajectoryNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: RocketRetroLandingTrajectoryNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RocketRetroLandingTrajectoryNode'
        '404':
          description: No encontrado
components:
  schemas:
    RocketRetroLandingTrajectoryNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
