openapi: 3.1.0
info:
  title: ProyectoTerahertzMolecularScanner API
  description: Escaneo Espectroscopico en Terahercios para Calidad Agroalimentaria y Seguridad
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoterahertzmolecularscanner
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoterahertzmolecularscanner/{id}:
    get:
      summary: Obtener TerahertzAbsorptionSpectrumNode por Identificador
      operationId: getTerahertzAbsorptionSpectrumNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TerahertzAbsorptionSpectrumNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerahertzAbsorptionSpectrumNode'
        '404':
          description: No encontrado
components:
  schemas:
    TerahertzAbsorptionSpectrumNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
