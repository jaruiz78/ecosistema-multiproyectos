asyncapi: 3.0.0
info:
  title: ProyectoEcoTourismPassport Event Stream
  version: 1.0.0
  description: Transmisión de eventos reactivos y telemetría para ProyectoEcoTourismPassport
channels:
  telemetryEvents:
    address: 'corp.proyectoecotourismpassport.events'
    messages:
      telemetryMessage:
        payload:
          type: object
          properties:
            tenantId:
              type: string
            timestamp:
              type: string
              format: date-time
