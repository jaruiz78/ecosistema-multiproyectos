openapi: 3.1.0
info:
  title: ProyectoPlayasInteligentesCostas API
  description: Plataforma de monitorización de calidad de aguas de baño, corrientes y aforos en playas inteligentes
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoplayasinteligentescostas
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoplayasinteligentescostas/{id}:
    get:
      summary: Obtener BeachSectorSafetyZone por Identificador
      operationId: getBeachSectorSafetyZoneById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: BeachSectorSafetyZone recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeachSectorSafetyZone'
        '404':
          description: No encontrado
components:
  schemas:
    BeachSectorSafetyZone:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
