openapi: 3.1.0
info:
  title: ProyectoFusionPlasmaTokamakTwin API
  description: Gemelo Digital de Estabilidad Magnetohidrodinamica de Plasma en Reactores Tokamak
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectofusionplasmatokamaktwin
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectofusionplasmatokamaktwin/{id}:
    get:
      summary: Obtener PlasmaMhdMagneticFluxNode por Identificador
      operationId: getPlasmaMhdMagneticFluxNodeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PlasmaMhdMagneticFluxNode recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlasmaMhdMagneticFluxNode'
        '404':
          description: No encontrado
components:
  schemas:
    PlasmaMhdMagneticFluxNode:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
