openapi: 3.1.0
info:
  title: ProyectoMetabolicOptKnockEngineering API
  description: Optimizacion Metabolica por Delecion de Genes para Bioplasticos
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectometabolicoptknockengineering
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectometabolicoptknockengineering/{id}:
    get:
      summary: Obtener GeneDeletionTargetVectorToken por Identificador
      operationId: getGeneDeletionTargetVectorTokenById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GeneDeletionTargetVectorToken recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneDeletionTargetVectorToken'
        '404':
          description: No encontrado
components:
  schemas:
    GeneDeletionTargetVectorToken:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
