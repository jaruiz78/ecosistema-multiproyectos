openapi: 3.1.0
info:
  title: ProyectoFlatOpticsMetalensImaging API
  description: Optica Plana y Metalentes Dielectricas para Micro-Satelites y Drones
  version: 1.0.0
servers:
  - url: https://api.corp.internal/proyectoflatopticsmetalensimaging
    description: Cloud Run Enterprise Endpoint
paths:
  /api/v1/proyectoflatopticsmetalensimaging/{id}:
    get:
      summary: Obtener MetalensPhaseProfileMatrixBatch por Identificador
      operationId: getMetalensPhaseProfileMatrixBatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MetalensPhaseProfileMatrixBatch recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetalensPhaseProfileMatrixBatch'
        '404':
          description: No encontrado
components:
  schemas:
    MetalensPhaseProfileMatrixBatch:
      type: object
      required:
        - id
        - tenantId
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
