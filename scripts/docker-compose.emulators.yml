version: '3.8'

services:
  # GCP Pub/Sub Emulator
  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - local-ecosystem
    environment:
      - PUBSUB_PROJECT_ID=local-ecosystem-project

  # Firestore Emulator
  firestore:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    networks:
      - local-ecosystem
    environment:
      - FIRESTORE_PROJECT_ID=local-ecosystem-project

  # Ollama for Local AI Inference
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - local-ecosystem
    # command: serve

networks:
  local-ecosystem:
    driver: bridge
