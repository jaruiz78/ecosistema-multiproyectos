apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-service
  labels:
    app.kubernetes.io/name: enterprise-service
    app.kubernetes.io/part-of: antigravity-ecosystem
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-service
  template:
    metadata:
      labels:
        app: enterprise-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: service
          image: europe-west1-docker.pkg.dev/corporate/apps/service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-service
spec:
  type: ClusterIP
  selector:
    app: enterprise-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
