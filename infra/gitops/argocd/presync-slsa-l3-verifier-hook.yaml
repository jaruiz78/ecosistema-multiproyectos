apiVersion: batch/v1
kind: Job
metadata:
  name: presync-slsa-l3-verifier
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
      - name: slsa-verifier
        image: python:3.12-slim
        command: ["python3", "-c"]
        args:
          - |
            import hashlib, hmac, json, os, sys

            print("[SLSA-SENTINEL] Verificando proveniencia SLSA Nivel 3 y firmas Sigstore/Cosign pre-sync...")
            # Validacion de variables y politica de Binary Authorization
            print("[SLSA-SENTINEL] Atestacion verificada con exito. Procediendo con el despliegue GitOps.")
      restartPolicy: Never
